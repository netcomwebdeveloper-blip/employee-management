# Nixpacks configuration for Railway deployment
# Use the official Python provider which configures /opt/venv and pip automatically
providers = ["python"]

[variables]
NIXPACKS_PYTHON_VERSION = "3.12"

[phases.build]
cmds = ["python manage.py collectstatic --no-input"]

[start]
cmd = "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
