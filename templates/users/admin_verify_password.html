{% extends 'base.html' %}
{% block title %}Admin Panel Password Verification | NETCOM{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 40px auto; background: #ffffff; border-radius: 16px; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); overflow: hidden;">
  <div style="padding: 24px; background: linear-gradient(135deg, #1e293b, #0f172a); color: #ffffff; text-align: center;">
    <div style="width: 50px; height: 50px; border-radius: 12px; background: rgba(59,130,246,0.2); margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; color: #60a5fa;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
    </div>
    <h2 style="font-size: 18px; font-weight: 700; margin: 0 0 4px; color: #ffffff;">Django Admin Security Gate</h2>
    <p style="font-size: 13px; color: #94a3b8; margin: 0;">Please enter your administrator password to proceed</p>
  </div>

  <form method="POST" action="{% url 'users:verify_admin_access' %}" style="padding: 28px;">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next_url|default:'/django-admin/' }}">

    <div class="form-group" style="margin-bottom: 20px;">
      <label class="form-label" style="font-weight: 600; font-size: 13px;">Administrator Account Password</label>
      <input type="password" name="admin_password" class="form-input" placeholder="Enter administrator password" required autofocus style="width: 100%; padding: 12px 14px; border-radius: 8px; border: 1.5px solid #cbd5e1; font-size: 14px;">
    </div>

    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-weight: 600; font-size: 14.5px;">
      Unlock & Enter Admin Panel
    </button>
    <div style="text-align: center; margin-top: 14px;">
      <a href="{% url 'dashboard:index' %}" style="font-size: 13px; color: #64748b; text-decoration: none;">&larr; Return to Dashboard</a>
    </div>
  </form>
</div>
{% endblock %}
