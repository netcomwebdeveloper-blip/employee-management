<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Notice | NETCOM</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f8fafc;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #1e293b;
    }
    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 36px 32px;
      max-width: 500px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
      border: 1px solid #e2e8f0;
    }
    .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    h2 {
      margin: 0 0 10px 0;
      font-size: 22px;
      font-weight: 800;
      color: #0f172a;
    }
    p {
      color: #64748b;
      font-size: 14px;
      line-height: 1.6;
      margin: 0 0 24px 0;
    }
    .file-badge {
      display: inline-block;
      background: #f1f5f9;
      color: #334155;
      font-family: monospace;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 18px;
      border: 1px solid #cbd5e1;
    }
    .btn {
      display: inline-block;
      background: #4338ca;
      color: #ffffff;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      box-shadow: 0 4px 12px rgba(67, 56, 202, 0.3);
      transition: all 0.2s;
    }
    .btn:hover {
      background: #3730a3;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📁⚠️</div>
    <h2>Document Not Yet Uploaded</h2>
    <div class="file-badge">{{ filename|default:path }}</div>
    <p>
      The requested official document or media file has not been uploaded to the server yet or is unavailable.
      Please contact HR or Administrator to upload this document.
    </p>
    <a href="/dashboard/" class="btn">Return to Dashboard</a>
  </div>
</body>
</html>
